<title>SE2000 First Stitch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Familjen+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a "player" (stage + caption + transport) beside a "your turn" card; chapter strip below. */
:root{
  --bg:#f1f4f1; --surface:#ffffff; --fg:#16231d; --muted:#55665d; --line:#cdd7d0;
  --accent:#00673e; --accent-fg:#ffffff; --leaf:#4f9f36; --brass:#96790a; --warn:#b4541a;
  /* The stage is a light cutting mat in both themes, like a video frame. */
  --mat:#dfe8e3; --mat-grid:#c3d1ca; --ink:#1d2b25; --body:#fbfcfa; --part:#e3e8e4; --hi:#e0a800;
  --display:"Familjen Grotesk","Trebuchet MS",sans-serif;
  --text:"Atkinson Hyperlegible",Verdana,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1713; --surface:#18221d; --fg:#e7eeea; --muted:#9fb0a7; --line:#2b3a33;
  --accent:#49b985; --accent-fg:#06140d; --leaf:#7fd163; --brass:#e0bd3a; --warn:#f0995c; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1713; --surface:#18221d; --fg:#e7eeea; --muted:#9fb0a7; --line:#2b3a33;
  --accent:#49b985; --accent-fg:#06140d; --leaf:#7fd163; --brass:#e0bd3a; --warn:#f0995c; color-scheme:dark }
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--text);font-size:16px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-family:var(--display);font-size:1.6rem;font-weight:700;margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted)}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.player{flex:3 1 520px;min-width:0;display:flex;flex-direction:column;gap:10px}
.side{flex:2 1 300px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stage{position:relative;background:var(--mat);border-radius:10px;overflow:hidden;aspect-ratio:8/5;max-width:100%;border:1px solid var(--line)}
.stage svg,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.chip{position:absolute;left:10px;top:10px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:4px}
.gate{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center}
.caption{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:4.4em;font-size:1.08rem}
.caption b{font-family:var(--mono);font-size:.75rem;color:var(--muted);display:block;letter-spacing:.05em;margin-bottom:2px}
.transport{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;min-height:42px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.grow{flex:1}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.chapters{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.chapters button{padding:6px 10px;min-height:38px;font-size:.9rem;display:flex;gap:6px;align-items:center}
.chapters .n{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.chapters .cur{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chapters .cur .n{color:inherit}
.chapters .done .n::after{content:" ✓";color:var(--leaf)}
.side h2{font-family:var(--display);font-size:1.25rem;margin:0}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.todo input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
.todo input:checked+span{color:var(--muted);text-decoration:line-through}
.check{border-top:1px solid var(--line);padding-top:10px}
.check strong{color:var(--accent)}
.turn{font-weight:700;color:var(--warn)}
.note{color:var(--muted);font-size:.9rem;margin:0}
/* stage drawing */
.stage svg [data-fx]{transition:transform .9s ease,opacity .6s ease,stroke-dashoffset 1.5s ease}
.body{fill:var(--body);stroke:var(--ink);stroke-width:3}
.part{fill:var(--part);stroke:var(--ink);stroke-width:2.5}
.dark{fill:var(--ink)}
.screen{fill:#24352e;stroke:var(--ink);stroke-width:3}
.steel{stroke:#6d7b75;stroke-width:5;stroke-linecap:round;fill:none}
.thread{fill:none;stroke:#00673e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.thread.w{stroke:#8a98a8}
.hi{fill:none;stroke:var(--hi);stroke-width:5}
.hif{fill:var(--hi);stroke:var(--ink);stroke-width:2}
.arrow{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-family:var(--text);font-size:21px;font-weight:700;fill:var(--ink)}
.lbl.s{font-size:17px;font-weight:400}
.num{font-family:var(--mono);font-size:16px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.ring{fill:none;stroke:var(--hi);stroke-width:5;animation:pulse 1.2s ease-in-out infinite}
.spin{animation:spin .5s linear infinite}
@keyframes pulse{50%{stroke-width:10;opacity:.55}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.stage svg [data-fx]{transition:none}.ring,.spin{animation:none}}
</style>

<div class="wrap">
  <header>
    <h1>First Stitch on the Brother SE2000</h1>
    <p>Watch a step, pause, do it on your machine, tick it off.</p>
  </header>
  <div class="cols">
    <section class="player" aria-label="Walkthrough player">
      <div class="stage">
        <svg id="svg" viewBox="0 0 800 500" role="img" aria-label="Animated illustration of the current step"></svg>
        <canvas id="cv" width="1600" height="1000" hidden></canvas>
        <span class="chip" id="chip"></span>
        <div class="gate" id="gate" hidden><button class="primary" id="gateBtn"></button></div>
      </div>
      <div class="bar" aria-hidden="true"><i id="prog"></i></div>
      <div class="caption" aria-live="polite"><b id="capno"></b><span id="cap"></span></div>
      <div class="transport">
        <button id="prev" aria-label="Previous chapter">◀ Back</button>
        <button id="play" class="primary">▶ Play</button>
        <button id="replay">↺ Replay step</button>
        <button id="next">Next ▶</button>
        <span class="grow"></span>
        <button id="voice" aria-pressed="false" hidden>Read aloud: off</button>
        <button id="speed" aria-label="Playback speed">Speed 1×</button>
      </div>
    </section>
    <aside class="side">
      <span class="eyebrow" id="sideno"></span>
      <h2 id="sidetitle"></h2>
      <p class="turn" id="turn" hidden>Your turn. Do these on your machine, then press Next.</p>
      <ul class="todo" id="todo"></ul>
      <p class="check" id="check"></p>
      <p class="note">The drawings are simplified. Match them to the diagrams printed on your machine and the quick guide in the box.</p>
    </aside>
  </div>
  <ol class="chapters" id="chapters"></ol>
</div>

const $ = (id) => document.getElementById(id);
const svg = $('svg'), cv = $('cv'), ctx = cv.getContext('2d');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let ch = 0, beat = 0, t = 0, playing = false, speed = 1, voice = false, speaking = false, last = 0;
let ticks = store.get('ticks', {});
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const beatDur = (b) => b.d || Math.max(3.5, b.c.split(' ').length * 0.42);
const inRange = (spec, b) => { const [a, z] = String(spec).split('-'); return b >= +a && (z === undefined || b <= +z); };

function applyBeat() {
  svg.querySelectorAll('[data-fx]').forEach((el) => {
    const d = el.dataset; let op = 1, tf = '';
    if (d.show !== undefined && beat < +d.show) op = 0;
    if (d.only !== undefined && !inRange(d.only.includes('-') ? d.only : d.only + '-' + d.only, beat)) op = 0;
    if (d.hide !== undefined && inRange(d.hide, beat)) op = 0;
    if (d.from) { const [n, xy] = d.from.split(':'); if (beat < +n) { const [x, y] = xy.split(','); tf += `translate(${x}px,${y}px) `; op = 0; } }
    if (d.move) { const [r, xy] = d.move.split(':'); if (inRange(r, beat)) { const [x, y] = xy.split(','); tf += `translate(${x}px,${y}px) `; } }
    if (d.rot) { const [r, deg, o] = d.rot.split(':'); const [x, y] = o.split(','); el.style.transformOrigin = `${x}px ${y}px`; if (inRange(r, beat)) tf += `rotate(${deg}deg)`; }
    if (d.draw !== undefined) el.style.strokeDashoffset = beat >= +d.draw ? 0 : 1;
    if (d.spin) el.classList.toggle('spin', inRange(d.spin, beat) && playing);
    el.style.opacity = op; el.style.transform = tf || 'none';
  });
}

// Stitch canvas: design units are 0.1 mm, centred on the hoop centre.
const K = 1.2, CX = 800, CY = 500;
const counts = STITCH.map((b) => b.paths.reduce((n, p) => n + p.length / 2, 0));
function drawCanvas() {
  const c = CH[ch], b = c.beats[beat];
  ctx.fillStyle = '#e9dfc8'; ctx.fillRect(0, 0, 1600, 1000);
  ctx.strokeStyle = '#ddd0b3'; ctx.lineWidth = 1;
  for (let x = 0; x < 1600; x += 8) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1000); ctx.stroke(); }
  for (let y = 0; y < 1000; y += 8) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1600, y); ctx.stroke(); }
  ctx.strokeStyle = '#b4541a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(CX - 16, CY); ctx.lineTo(CX + 16, CY); ctx.moveTo(CX, CY - 16); ctx.lineTo(CX, CY + 16); ctx.stroke();
  let done = STITCH.length, frac = 1;
  if (c.cv === 'stitch') {
    done = 0; frac = 0;
    for (let i = 0; i <= beat; i++) { const bb = c.beats[i]; if (bb.run !== undefined) { if (i < beat) done = bb.run + 1; else { done = bb.run; frac = Math.min(1, t / beatDur(bb)); } } }
    if (b.run === undefined) frac = 0;
  }
  let tip = null, total = 0;
  STITCH.forEach((blk, i) => {
    if (i > done) return;
    let limit = i < done ? Infinity : Math.floor(counts[i] * frac), n = 0;
    ctx.strokeStyle = blk.color; ctx.lineWidth = 2.6; ctx.lineJoin = 'round';
    for (const p of blk.paths) {
      if (n >= limit) break;
      ctx.beginPath();
      for (let j = 0; j < p.length && n < limit; j += 2, n++) {
        const x = CX + p[j] * K, y = CY + p[j + 1] * K;
        j ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        if (i === done) tip = [x, y];
      }
      ctx.stroke();
    }
    total += Math.min(n, counts[i]);
  });
  if (c.cv === 'stitch' && tip && frac < 1 && b.run !== undefined) {
    ctx.strokeStyle = '#6d7b75'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(tip[0], tip[1] - 6); ctx.lineTo(tip[0], tip[1] - 150); ctx.stroke();
    ctx.fillStyle = '#1d2b25'; ctx.beginPath(); ctx.arc(tip[0], tip[1], 5, 0, 7); ctx.fill();
  }
  if (c.cv === 'stitch') {
    const all = counts.reduce((a, n) => a + n, 0), col = Math.min(3, b.run !== undefined ? b.run + 1 : Math.max(done, 1));
    ctx.fillStyle = '#1d2b25'; ctx.fillRect(1160, 900, 420, 80);
    ctx.fillStyle = '#fff'; ctx.font = '500 30px "JetBrains Mono",monospace';
    ctx.fillText(`${String(total).padStart(4, '0')}/${all}  color ${col}/3`, 1180, 950);
  }
  if (c.cv === 'finish' && beat >= 2) {
    ctx.setLineDash([18, 12]); ctx.strokeStyle = '#1d2b25'; ctx.lineWidth = 4;
    const w = 531 * K + 40, h = 160 * K + 40; ctx.beginPath(); ctx.roundRect(CX - w, CY - h, w * 2, h * 2, 40); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#1d2b25'; ctx.font = '700 34px "Atkinson Hyperlegible",Verdana,sans-serif'; ctx.fillText('Trim the stabilizer about 1/4 inch out', CX - w, CY + h + 56);
  }
}

function say(text) {
  if (!voice || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = Math.min(1.4, speed); speaking = true; u.onend = u.onerror = () => { speaking = false; }; speechSynthesis.speak(u); } catch (e) { speaking = false; }
}

function showBeat(announce = true) {
  const c = CH[ch], b = c.beats[beat];
  $('cap').textContent = b.c; $('capno').textContent = `STEP ${beat + 1} OF ${c.beats.length}`;
  $('gate').hidden = !b.gate; if (b.gate) { $('gateBtn').textContent = b.gate; setPlaying(false); }
  if (c.cv) drawCanvas(); else applyBeat();
  if (announce) say(b.c);
}

function load(i, autoplay) {
  ch = Math.max(0, Math.min(CH.length - 1, i)); beat = 0; t = 0; const c = CH[ch];
  try { speechSynthesis.cancel(); } catch (e) {} speaking = false;
  svg.toggleAttribute('hidden', !!c.cv); cv.hidden = !c.cv;
  if (!c.cv) { svg.innerHTML = SCENES[c.s](); beat = -1; applyBeat(); beat = 0; svg.getBoundingClientRect(); }
  $('chip').textContent = `${ch + 1}/${CH.length}  ${c.t}`;
  $('sideno').textContent = `Chapter ${ch + 1} of ${CH.length}`; $('sidetitle').textContent = c.t; $('check').innerHTML = '<strong>Check:</strong> ';
  $('check').append(c.check); $('turn').hidden = true;
  $('todo').innerHTML = '';
  c.todo.forEach((txt, j) => {
    const id = `c${ch}-${j}`, li = document.createElement('li'), lab = document.createElement('label'), inp = document.createElement('input'), sp = document.createElement('span');
    inp.type = 'checkbox'; inp.id = id; inp.checked = !!ticks[id]; sp.textContent = txt;
    inp.addEventListener('change', () => { ticks[id] = inp.checked; store.set('ticks', ticks); renderChapters(); });
    lab.append(inp, sp); li.append(lab); $('todo').append(li);
  });
  store.set('ch', ch); renderChapters(); setPlaying(!!autoplay);
  requestAnimationFrame(() => showBeat(!!autoplay));
}

function renderChapters() {
  const ol = $('chapters'); ol.innerHTML = '';
  CH.forEach((c, i) => {
    const li = document.createElement('li'), b = document.createElement('button');
    const done = c.todo.every((_, j) => ticks[`c${i}-${j}`]);
    b.className = (i === ch ? 'cur ' : '') + (done ? 'done' : '');
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span>`; b.append(c.t);
    if (i === ch) b.setAttribute('aria-current', 'step');
    b.addEventListener('click', () => load(i, false)); li.append(b); ol.append(li);
  });
}

function setPlaying(p) {
  playing = p; $('play').textContent = p ? '❚❚ Pause' : '▶ Play';
  if (!p) { try { speechSynthesis.cancel(); } catch (e) {} speaking = false; }
  if (!CH[ch].cv) applyBeat();
}
function endOfChapter() { setPlaying(false); $('turn').hidden = false; }
function advance() {
  const c = CH[ch];
  if (beat < c.beats.length - 1) { beat++; t = 0; showBeat(); } else endOfChapter();
}
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing) {
    const c = CH[ch], b = c.beats[beat]; t += dt * speed;
    $('prog').style.width = ((beat + Math.min(1, t / beatDur(b))) / c.beats.length * 100) + '%';
    if (c.cv === 'stitch' && b.run !== undefined) drawCanvas();
    if (t >= beatDur(b) && !speaking && !b.gate) advance();
  }
  requestAnimationFrame(frame);
}

$('play').addEventListener('click', () => {
  const c = CH[ch];
  if (!playing && beat === c.beats.length - 1 && t >= beatDur(c.beats[beat])) { load(ch, true); return; }
  if (c.beats[beat].gate) return;
  setPlaying(!playing); if (playing && t === 0) say(c.beats[beat].c);
});
$('replay').addEventListener('click', () => load(ch, true));
$('prev').addEventListener('click', () => load(ch - 1, false));
$('next').addEventListener('click', () => load(ch + 1, true));
$('gateBtn').addEventListener('click', () => { $('gate').hidden = true; beat++; t = 0; setPlaying(true); showBeat(); });
$('speed').addEventListener('click', () => { speed = speed === 1 ? 1.5 : speed === 1.5 ? 0.75 : 1; $('speed').textContent = `Speed ${speed}×`; });
if ('speechSynthesis' in window) {
  $('voice').hidden = false;
  $('voice').addEventListener('click', () => { voice = !voice; $('voice').setAttribute('aria-pressed', voice); $('voice').textContent = `Read aloud: ${voice ? 'on' : 'off'}`; if (voice) say(CH[ch].beats[beat].c); else { try { speechSynthesis.cancel(); } catch (e) {} speaking = false; } });
}
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input,button')) return;
  if (e.key === ' ') { e.preventDefault(); $('play').click(); }
  if (e.key === 'ArrowRight') $('next').click();
  if (e.key === 'ArrowLeft') $('prev').click();
});
load(store.get('ch', 0), false);
requestAnimationFrame((n) => { last = n; frame(n); });
</script>
