<title>SE2000 First Stitch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Familjen+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a "player" (stage + caption + transport) beside a "your turn" card; chapter strip below. */
:root{
  --bg:#f1f4f1; --surface:#ffffff; --fg:#16231d; --muted:#55665d; --line:#cdd7d0;
  --accent:#00673e; --accent-fg:#ffffff; --leaf:#4f9f36; --brass:#96790a; --warn:#b4541a;
  /* The stage is a light cutting mat in both themes, like a video frame. */
  --mat:#dfe8e3; --mat-grid:#c3d1ca; --ink:#1d2b25; --body:#fbfcfa; --part:#e3e8e4; --hi:#e0a800;
  --display:"Familjen Grotesk","Trebuchet MS",sans-serif;
  --text:"Atkinson Hyperlegible",Verdana,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1713; --surface:#18221d; --fg:#e7eeea; --muted:#9fb0a7; --line:#2b3a33;
  --accent:#49b985; --accent-fg:#06140d; --leaf:#7fd163; --brass:#e0bd3a; --warn:#f0995c; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1713; --surface:#18221d; --fg:#e7eeea; --muted:#9fb0a7; --line:#2b3a33;
  --accent:#49b985; --accent-fg:#06140d; --leaf:#7fd163; --brass:#e0bd3a; --warn:#f0995c; color-scheme:dark }
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--text);font-size:16px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-family:var(--display);font-size:1.6rem;font-weight:700;margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted)}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.player{flex:3 1 520px;min-width:0;display:flex;flex-direction:column;gap:10px}
.side{flex:2 1 300px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stage{position:relative;background:var(--mat);border-radius:10px;overflow:hidden;aspect-ratio:8/5;max-width:100%;border:1px solid var(--line)}
.stage svg,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.chip{position:absolute;left:10px;top:10px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:4px}
.gate{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center}
.caption{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:4.4em;font-size:1.08rem}
.caption b{font-family:var(--mono);font-size:.75rem;color:var(--muted);display:block;letter-spacing:.05em;margin-bottom:2px}
.transport{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;min-height:42px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.grow{flex:1}
.voice{display:flex;gap:8px;align-items:center;color:var(--muted)}
select{font:inherit;min-height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 10px}
.caption em{display:block;color:var(--muted);font-size:.92rem;margin-top:6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.chapters{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.chapters button{padding:6px 10px;min-height:38px;font-size:.9rem;display:flex;gap:6px;align-items:center}
.chapters .n{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.chapters .cur{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chapters .cur .n{color:inherit}
.chapters .done .n::after{content:" ✓";color:var(--leaf)}
.side h2{font-family:var(--display);font-size:1.25rem;margin:0}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.todo input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
.todo input:checked+span{color:var(--muted);text-decoration:line-through}
.check{border-top:1px solid var(--line);padding-top:10px}
.check strong{color:var(--accent)}
.turn{font-weight:700;color:var(--warn)}
.note{color:var(--muted);font-size:.9rem;margin:0}
/* stage drawing */
.stage svg [data-fx]{transition:transform .9s ease,opacity .6s ease,stroke-dashoffset 1.5s ease}
.body{fill:var(--body);stroke:var(--ink);stroke-width:3}
.part{fill:var(--part);stroke:var(--ink);stroke-width:2.5}
.dark{fill:var(--ink)}
.screen{fill:#24352e;stroke:var(--ink);stroke-width:3}
.steel{stroke:#6d7b75;stroke-width:5;stroke-linecap:round;fill:none}
.thread{fill:none;stroke:#00673e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.thread.w{stroke:#8a98a8}
.hi{fill:none;stroke:var(--hi);stroke-width:5}
.hif{fill:var(--hi);stroke:var(--ink);stroke-width:2}
.arrow{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-family:var(--text);font-size:21px;font-weight:700;fill:var(--ink)}
.lbl.s{font-size:17px;font-weight:400}
.num{font-family:var(--mono);font-size:16px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.ring{fill:none;stroke:var(--hi);stroke-width:5;animation:pulse 1.2s ease-in-out infinite}
.spin{animation:spin .5s linear infinite}
@keyframes pulse{50%{stroke-width:10;opacity:.55}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.stage svg [data-fx]{transition:none}.ring,.spin{animation:none}}
</style>

<div class="wrap">
  <header>
    <h1>First Stitch on the Brother SE2000</h1>
    <p>Watch a step, pause, do it on your machine, tick it off.</p>
  </header>
  <div class="cols">
    <section class="player" aria-label="Walkthrough player">
      <div class="stage">
        <svg id="svg" viewBox="0 0 800 500" role="img" aria-label="Animated illustration of the current step"></svg>
        <canvas id="cv" width="1600" height="1000" hidden></canvas>
        <span class="chip" id="chip"></span>
        <div class="gate" id="gate" hidden><button class="primary" id="gateBtn"></button></div>
      </div>
      <div class="bar" aria-hidden="true"><i id="prog"></i></div>
      <div class="caption" aria-live="polite"><b id="capno"></b><span id="cap"></span><em id="capsaid" hidden></em></div>
      <div class="transport">
        <button id="prev" aria-label="Previous chapter">◀ Back</button>
        <button id="play" class="primary">▶ Play</button>
        <button id="replay">↺ Replay step</button>
        <button id="next">Next ▶</button>
        <span class="grow"></span>
        <label class="voice" id="voicewrap" hidden>Read aloud <select id="voice"><option value="">Off</option><option value="std">Standard</option><option value="scot">Scottish Highlands</option><option value="south">Deep South Georgia</option><option value="cockney">Cockney</option></select></label>
        <button id="speed" aria-label="Playback speed">Speed 1×</button>
      </div>
    </section>
    <aside class="side">
      <span class="eyebrow" id="sideno"></span>
      <h2 id="sidetitle"></h2>
      <p class="turn" id="turn" hidden>Your turn. Do these on your machine, then press Next.</p>
      <ul class="todo" id="todo"></ul>
      <p class="check" id="check"></p>
      <p class="note">The drawings are simplified. Match them to the diagrams printed on your machine and the quick guide in the box.</p>
    </aside>
  </div>
  <ol class="chapters" id="chapters"></ol>
</div>

<script>
const STITCH = __STITCH__;
const GRID = `<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c3d1ca" stroke-width="1.5"/></pattern></defs><rect width="800" height="500" fill="url(#g)"/>`;
const fx = (o) => 'data-fx ' + Object.entries(o).map(([k, v]) => `data-${k}="${v}"`).join(' ');

// Front view of the machine. Needle is at x=278.
const mach = (extra = '') => `
  <rect x="215" y="374" width="130" height="44" rx="6" class="body"/>
  <rect x="330" y="360" width="390" height="70" rx="8" class="body"/>
  <rect x="560" y="140" width="160" height="230" rx="10" class="body"/>
  <rect x="215" y="120" width="505" height="95" rx="20" class="body"/>
  <rect x="215" y="120" width="125" height="185" rx="16" class="body"/>
  <rect x="585" y="190" width="110" height="78" rx="6" class="screen"/>
  <rect x="716" y="278" width="26" height="46" rx="8" class="part"/>
  <rect x="716" y="386" width="14" height="22" rx="3" class="dark"/>
  ${extra}`;
const needle = (a = '') => `<g ${a}><line x1="278" y1="305" x2="278" y2="356" class="steel"/><path d="M262 356h32v8h-32z" class="part"/></g>`;
const startBtn = (fill = '#3fae5a') => `<circle cx="302" cy="262" r="11" fill="${fill}" stroke="#1d2b25" stroke-width="2.5"/>`;
const flatbed = (a = '') => `<rect ${a} x="150" y="360" width="190" height="70" rx="8" class="body"/>`;
const unit = (a = '', car = '') => `<g ${a}><rect x="50" y="372" width="290" height="58" rx="8" class="body"/><g ${car}><rect x="80" y="350" width="130" height="24" rx="5" class="part"/><rect x="200" y="340" width="26" height="14" rx="3" class="part"/></g></g>`;

const SCENES = {
  setup: () => GRID + mach(needle() + startBtn('#c9d2cc')) + flatbed() + `
    <g ${fx({show: 0})}><path class="arrow" d="M135 330H30M30 330l14-10M30 330l14 10"/><text x="34" y="312" class="lbl">12 in clear</text>
      <path class="arrow" d="M470 105V40M470 40l-10 14M470 40l10 14"/><text x="486" y="62" class="lbl">12 in behind</text></g>
    <g ${fx({hide: 1})}><rect x="250" y="290" width="56" height="16" class="hif" transform="rotate(-18 278 298)"/><rect x="600" y="150" width="70" height="16" class="hif" transform="rotate(8 635 158)"/><rect x="380" y="352" width="64" height="16" class="hif"/><text x="452" y="346" class="lbl s">tape and foam</text></g>
    <g ${fx({only: 2})}><circle cx="723" cy="397" r="24" class="ring"/><text x="590" y="466" class="lbl">Power switch: off</text></g>`,

  unit: () => GRID + mach(needle() + `<g ${fx({show: 2})}><rect x="590" y="195" width="100" height="68" rx="4" fill="#bfe8d2"/></g>` + startBtn('#c9d2cc'))
    + flatbed(fx({move: '0:-170,0', hide: 0}))
    + unit(fx({from: '1:-230,0'}), fx({move: '2:70,0'})) + `
    <g ${fx({only: 0})}><path class="arrow" d="M150 340H60M60 340l14-10M60 340l14 10"/><text x="40" y="70" class="lbl">Flat bed slides off</text></g>
    <g ${fx({only: 1})}><path class="arrow" d="M60 340h110M170 340l-14-10M170 340l-14 10"/><text x="40" y="70" class="lbl">Embroidery unit slides on</text><circle cx="338" cy="398" r="20" class="ring"/></g>
    <g ${fx({only: 2})}><circle cx="723" cy="397" r="24" class="ring"/><text x="40" y="70" class="lbl">Carriage moves. Hands clear.</text></g>
    <g ${fx({only: 3})}><rect x="580" y="185" width="120" height="88" rx="8" class="ring"/><text x="450" y="466" class="lbl">Embroidery menu</text></g>`,

  foot: () => GRID + `
    <rect x="250" y="0" width="300" height="130" class="body"/>
    <rect x="300" y="120" width="34" height="210" class="part"/><rect x="290" y="300" width="54" height="36" rx="4" class="part"/>
    <line x1="317" y1="336" x2="317" y2="440" class="steel"/>
    <rect x="400" y="120" width="40" height="200" class="part"/>
    <circle cx="462" cy="296" r="13" class="hif" ${fx({rot: '3:200:462,296'})}/><path d="M454 296h16" stroke="#1d2b25" stroke-width="3" ${fx({rot: '3:200:462,296'})}/>
    <g ${fx({move: '1:60,140', hide: 1})}><path d="M392 290h56v44h-56z" class="part"/><path d="M360 334h130l16 26H344z" class="part"/><text x="520" y="352" class="lbl s">sewing foot + holder</text></g>
    <g ${fx({from: '2:40,150'})}><path d="M404 286h34v70h-34z" class="body"/><path d="M290 356h150v14H290z" class="body"/><circle cx="317" cy="363" r="20" fill="none" stroke="#1d2b25" stroke-width="5"/>
      <path class="thread w" d="M438 300c60-10 90-60 90-140" ${fx({show: 2})}/></g>
    <g ${fx({only: 0})}><rect x="590" y="40" width="160" height="110" rx="8" class="screen"/><rect x="640" y="88" width="60" height="42" rx="6" class="hif"/><path d="M652 88v-14a18 18 0 0 1 36 0v14" class="hi"/><text x="596" y="182" class="lbl">Lock key</text></g>
    <g ${fx({only: 2})}><circle cx="462" cy="296" r="26" class="ring"/><text x="500" y="250" class="lbl">Foot UH: notch to screw</text></g>
    <g ${fx({only: 3})}><circle cx="462" cy="296" r="26" class="ring"/><text x="500" y="250" class="lbl">Tighten firmly</text></g>
    <g ${fx({show: 4})}><rect x="500" y="130" width="56" height="34" rx="5" class="dark"/><text x="566" y="154" class="lbl">Jack, back left</text></g>
    <text x="40" y="470" class="lbl s">Close-up of the needle area</text>`,

  wind: () => GRID + mach(needle()) + flatbed() + `
    <g ${fx({only: '2-2'})}>${startBtn('#f08a24')}</g><g ${fx({hide: '2-2'})}>${startBtn('#c9d2cc')}</g>
    <rect x="430" y="82" width="66" height="38" rx="6" fill="#f4f6f8" stroke="#1d2b25" stroke-width="2.5"/><rect x="496" y="90" width="12" height="22" rx="3" class="part"/>
    <circle cx="545" cy="100" r="8" class="part"/><circle cx="592" cy="106" r="12" class="part"/>
    <path class="thread w" pathLength="1" stroke-dasharray="1" d="M496 96L545 92L592 94 L600 112 L650 100" ${fx({draw: 0})}/>
    <g ${fx({move: '2-2:16,0'})}><rect x="644" y="100" width="12" height="22" class="dark"/>
      <g ${fx({show: 1})}><rect x="634" y="84" width="32" height="22" rx="4" class="body"/>
        <rect x="638" y="88" width="24" height="14" fill="#8a98a8" ${fx({show: 3})}/>
        <g ${fx({only: '2-2', spin: '2-2'})} style="transform-origin:650px 95px"><path d="M640 95h20" stroke="#8a98a8" stroke-width="6"/></g></g></g>
    <g ${fx({only: 0})}><text x="40" y="60" class="lbl">Follow the winding diagram on top</text></g>
    <g ${fx({only: 1})}><circle cx="650" cy="96" r="30" class="ring"/><text x="40" y="60" class="lbl">Bobbin on the winder shaft</text></g>
    <g ${fx({only: 2})}><path class="arrow" d="M640 60h44M684 60l-12-9M684 60l-12 9"/><text x="40" y="60" class="lbl">Shaft right, then Start/Stop</text><circle cx="302" cy="262" r="24" class="ring"/></g>
    <g ${fx({only: 3})}><path class="arrow" d="M690 60h-44M646 60l12-9M646 60l12 9"/><text x="40" y="60" class="lbl">Shaft back to the left</text></g>`,

  bobbin: () => GRID + `
    <rect x="120" y="60" width="560" height="380" rx="18" class="body"/>
    <circle cx="400" cy="120" r="7" class="dark"/><text x="420" y="127" class="lbl s">needle</text>
    <circle cx="400" cy="290" r="96" class="part"/>
    <path d="M300 350l-34 34" class="steel"/><path d="M252 372l24 24" stroke="#1d2b25" stroke-width="4"/>
    <g ${fx({from: '1:0,-90'})}><circle cx="400" cy="290" r="74" fill="#fff" stroke="#1d2b25" stroke-width="3"/><circle cx="400" cy="290" r="58" fill="none" stroke="#8a98a8" stroke-width="20"/><circle cx="400" cy="290" r="12" class="dark"/>
      <path class="thread w" d="M400 222H330" /></g>
    <g ${fx({only: 1})}><path class="arrow" d="M470 200a100 100 0 0 0-150 0M320 200l4-20M320 200l20-2"/><text x="250" y="178" class="lbl">Unwinds to the left</text></g>
    <path class="thread w" pathLength="1" stroke-dasharray="1" d="M330 222C290 240 290 320 304 348L262 388" ${fx({draw: 2})}/>
    <g ${fx({only: 2})}><circle cx="300" cy="350" r="26" class="ring"/><text x="140" y="430" class="lbl">Around the tab, through the slit</text></g>
    <g ${fx({hide: '0-2', move: '0-2:150,60'})}><rect x="290" y="180" width="240" height="220" rx="24" fill="#ffffffcc" stroke="#1d2b25" stroke-width="3"/><text x="356" y="300" class="lbl s">bobbin cover</text></g>
    <g ${fx({only: 0})}><rect x="548" y="270" width="54" height="26" rx="6" class="hif"/><path class="arrow" d="M556 250h44M600 250l-12-9M600 250l-12 9"/><text x="470" y="230" class="lbl">Latch right</text></g>
    <g ${fx({only: 3})}><circle cx="258" cy="386" r="26" class="ring"/><text x="140" y="470" class="lbl">Cutter trims it. Cover on, tab first.</text></g>
    <text x="140" y="92" class="lbl s">Looking down at the needle plate</text>`,

  thread: () => GRID + mach('') + flatbed() + `
    <g ${fx({move: '4-4:0,6'})}>${needle()}</g>${startBtn('#c9d2cc')}
    <rect x="258" y="134" width="8" height="150" rx="4" class="dark"/><rect x="296" y="134" width="8" height="110" rx="4" class="dark"/>
    <g ${fx({show: 1})}><rect x="430" y="82" width="66" height="38" rx="6" fill="#00673e" stroke="#1d2b25" stroke-width="2.5"/><rect x="418" y="88" width="12" height="26" rx="3" class="part"/></g>
    <path class="thread" pathLength="1" stroke-dasharray="1" d="M430 96L372 96L330 112L300 128V240" ${fx({draw: 1})}/>
    <path class="thread" pathLength="1" stroke-dasharray="1" d="M300 240Q300 262 281 262Q262 262 262 240V140" ${fx({draw: 2})}/>
    <path class="thread" pathLength="1" stroke-dasharray="1" d="M262 140Q270 128 274 140V300" ${fx({draw: 3})}/>
    <path class="thread" pathLength="1" stroke-dasharray="1" d="M274 300L278 344" ${fx({draw: 4})}/>
    <path class="thread" pathLength="1" stroke-dasharray="1" d="M278 344Q300 372 350 350" ${fx({draw: 5})}/>
    <g ${fx({show: 1})}><circle cx="372" cy="96" r="13" class="dark"/><text x="372" y="96" class="num">1</text><circle cx="300" cy="186" r="13" class="dark"/><text x="300" y="186" class="num">2</text></g>
    <g ${fx({show: 2})}><circle cx="281" cy="262" r="13" class="dark"/><text x="281" y="262" class="num">3</text><circle cx="262" cy="150" r="13" class="dark"/><text x="262" y="150" class="num">4</text></g>
    <g ${fx({show: 3})}><circle cx="274" cy="296" r="13" class="dark"/><text x="274" y="296" class="num">6</text></g>
    <rect x="222" y="270" width="30" height="12" rx="4" class="hif" ${fx({move: '4-4:0,46'})}/>
    <g ${fx({only: 0})}><path class="arrow" d="M240 400v-40M240 360l-10 13M240 360l10 13"/><text x="40" y="60" class="lbl">Needle up. Foot UP. Screen locked.</text><circle cx="278" cy="352" r="28" class="ring"/></g>
    <g ${fx({only: 1})}><text x="40" y="60" class="lbl">Top guides, then down the right channel</text></g>
    <g ${fx({only: 2})}><circle cx="262" cy="138" r="26" class="ring"/><text x="40" y="60" class="lbl">Up the left, over the take-up lever</text></g>
    <g ${fx({only: 3})}><text x="40" y="60" class="lbl">Down to the guide above the needle</text></g>
    <g ${fx({only: 4})}><circle cx="237" cy="322" r="26" class="ring"/><text x="40" y="60" class="lbl">Disk 7, then threader lever down</text></g>
    <g ${fx({only: 5})}><text x="40" y="60" class="lbl">4 inches under the foot, to the back</text></g>`,

  hoop: () => {
    const iso = (y) => `transform="translate(0 ${y}) skewX(-28) scale(1 .5)"`;
    const frame = (c, w) => `<rect x="330" y="0" width="330" height="240" rx="34" fill="none" stroke="${c}" stroke-width="${w}"/>`;
    return GRID + `
    <g ${iso(330)}>${frame('#1d2b25', 30)}${frame('#aab7b0', 22)}<rect x="660" y="96" width="46" height="46" rx="8" class="hif" ${fx({rot: '4:180:683,119'})}/></g>

function applyBeat() {
  svg.querySelectorAll('[data-fx]').forEach((el) => {
    const d = el.dataset; let op = 1, tf = '';
    if (d.show !== undefined && beat < +d.show) op = 0;
    if (d.only !== undefined && !inRange(d.only.includes('-') ? d.only : d.only + '-' + d.only, beat)) op = 0;
    if (d.hide !== undefined && inRange(d.hide, beat)) op = 0;
    if (d.from) { const [n, xy] = d.from.split(':'); if (beat < +n) { const [x, y] = xy.split(','); tf += `translate(${x}px,${y}px) `; op = 0; } }
    if (d.move) { const [r, xy] = d.move.split(':'); if (inRange(r, beat)) { const [x, y] = xy.split(','); tf += `translate(${x}px,${y}px) `; } }
    if (d.rot) { const [r, deg, o] = d.rot.split(':'); const [x, y] = o.split(','); el.style.transformOrigin = `${x}px ${y}px`; if (inRange(r, beat)) tf += `rotate(${deg}deg)`; }

  let body = a.talk(text);
  body = /^[A-Z][a-z]/.test(body) && !/^(Henderson|Emerald|Leaf|Brass|Start)/.test(body) ? body[0].toLowerCase() + body.slice(1) : body;
  return `${a.open[k % a.open.length]} ${body} ${a.close[(k + ch) % a.close.length]}`;
}
function say(text) {
  const a = ACCENTS[voice];
  $('capsaid').hidden = !(a && a.open); if (a && a.open) $('capsaid').textContent = '“' + flavour(text) + '”';
  if (!a || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(flavour(text)), v = a.pick(voices);
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = Math.min(1.5, speed * a.rate); u.pitch = a.pitch; speaking = true; u.onend = u.onerror = () => { speaking = false; }; speechSynthesis.speak(u);
  } catch (e) { speaking = false; }
}

function showBeat(announce = true) {
  const c = CH[ch], b = c.beats[beat];
  $('cap').textContent = b.c; $('capno').textContent = `STEP ${beat + 1} OF ${c.beats.length}`;
  $('gate').hidden = !b.gate; if (b.gate) { $('gateBtn').textContent = b.gate; setPlaying(false); }
  if (c.cv) drawCanvas(); else applyBeat();
  const ac = ACCENTS[voice]; $('capsaid').hidden = !(ac && ac.open); if (ac && ac.open) $('capsaid').textContent = '“' + flavour(b.c) + '”';
  if (announce) say(b.c);
}

function load(i, autoplay) {
  ch = Math.max(0, Math.min(CH.length - 1, i)); beat = 0; t = 0; const c = CH[ch];
  try { speechSynthesis.cancel(); } catch (e) {} speaking = false;
  svg.toggleAttribute('hidden', !!c.cv); cv.hidden = !c.cv;
  if (!c.cv) { svg.innerHTML = SCENES[c.s](); beat = -1; applyBeat(); beat = 0; svg.getBoundingClientRect(); }
  $('chip').textContent = `${ch + 1}/${CH.length}  ${c.t}`;
  $('sideno').textContent = `Chapter ${ch + 1} of ${CH.length}`; $('sidetitle').textContent = c.t; $('check').innerHTML = '<strong>Check:</strong> ';
  $('check').append(c.check); $('turn').hidden = true;
  $('todo').innerHTML = '';
  c.todo.forEach((txt, j) => {
    const id = `c${ch}-${j}`, li = document.createElement('li'), lab = document.createElement('label'), inp = document.createElement('input'), sp = document.createElement('span');
    inp.type = 'checkbox'; inp.id = id; inp.checked = !!ticks[id]; sp.textContent = txt;
    inp.addEventListener('change', () => { ticks[id] = inp.checked; store.set('ticks', ticks); renderChapters(); });
    lab.append(inp, sp); li.append(lab); $('todo').append(li);
  });
  store.set('ch', ch); renderChapters(); setPlaying(!!autoplay);
  requestAnimationFrame(() => showBeat(!!autoplay));
}

function renderChapters() {
  const ol = $('chapters'); ol.innerHTML = '';
  CH.forEach((c, i) => {
    const li = document.createElement('li'), b = document.createElement('button');
    const done = c.todo.every((_, j) => ticks[`c${i}-${j}`]);
    b.className = (i === ch ? 'cur ' : '') + (done ? 'done' : '');
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span>`; b.append(c.t);
    if (i === ch) b.setAttribute('aria-current', 'step');
    b.addEventListener('click', () => load(i, false)); li.append(b); ol.append(li);
  });
}

function setPlaying(p) {
  playing = p; $('play').textContent = p ? '❚❚ Pause' : '▶ Play';
  if (!p) { try { speechSynthesis.cancel(); } catch (e) {} speaking = false; }
  if (!CH[ch].cv) applyBeat();
}
function endOfChapter() { setPlaying(false); $('turn').hidden = false; }
function advance() {
  const c = CH[ch];
  if (beat < c.beats.length - 1) { beat++; t = 0; showBeat(); } else endOfChapter();
}
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing) {
    const c = CH[ch], b = c.beats[beat]; t += dt * speed;
    $('prog').style.width = ((beat + Math.min(1, t / beatDur(b))) / c.beats.length * 100) + '%';
    if (c.cv === 'stitch' && b.run !== undefined) drawCanvas();
    if (t >= beatDur(b) && !speaking && !b.gate) advance();
  }
  requestAnimationFrame(frame);
}

$('play').addEventListener('click', () => {
  const c = CH[ch];
  if (!playing && beat === c.beats.length - 1 && t >= beatDur(c.beats[beat])) { load(ch, true); return; }
  if (c.beats[beat].gate) return;
  setPlaying(!playing); if (playing && t === 0) say(c.beats[beat].c);
});
$('replay').addEventListener('click', () => load(ch, true));
$('prev').addEventListener('click', () => load(ch - 1, false));
$('next').addEventListener('click', () => load(ch + 1, true));
$('gateBtn').addEventListener('click', () => { $('gate').hidden = true; beat++; t = 0; setPlaying(true); showBeat(); });
$('speed').addEventListener('click', () => { speed = speed === 1 ? 1.5 : speed === 1.5 ? 0.75 : 1; $('speed').textContent = `Speed ${speed}×`; });
if ('speechSynthesis' in window) {
  $('voicewrap').hidden = false;
  const loadVoices = () => { try { voices = speechSynthesis.getVoices(); } catch (e) {} };
  loadVoices(); try { speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) {}
  $('voice').value = store.get('accent', '') in ACCENTS ? store.get('accent', '') : '';
  voice = $('voice').value;
  $('voice').addEventListener('change', () => { voice = $('voice').value; store.set('accent', voice); try { speechSynthesis.cancel(); } catch (e) {} speaking = false; say(CH[ch].beats[beat].c); });
}
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input,button')) return;
  if (e.key === ' ') { e.preventDefault(); $('play').click(); }
  if (e.key === 'ArrowRight') $('next').click();
  if (e.key === 'ArrowLeft') $('prev').click();
});
load(store.get('ch', 0), false);
requestAnimationFrame((n) => { last = n; frame(n); });
</script>
